name: Finish social0211 image

on:
  push:
    paths:
      - 'social0211/assets/.upload-parts/READY'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact JPEG and update page
        shell: bash
        run: |
          set -euo pipefail
          PARTDIR='social0211/assets/.upload-parts'
          OUT='social0211/assets/hillsboro-mums-walmart.jpeg'
          HTML='social0211/index.html'
          cat "$PARTDIR"/part-00 "$PARTDIR"/exact-* > /tmp/hillsboro.b64
          base64 -d /tmp/hillsboro.b64 > "$OUT"
          ACTUAL=$(git hash-object "$OUT")
          EXPECTED='408a2056d67b32daf83741002986f715cc7a73fe'
          test "$ACTUAL" = "$EXPECTED"
          python - <<'PY'
          from pathlib import Path
          p=Path('social0211/index.html')
          s=p.read_text()
          old='assets/walmart-0211-fall-mums.jpeg?v=3'
          new='assets/hillsboro-mums-walmart.jpeg?v=1'
          if s.count(old) != 2:
              raise SystemExit(f'Expected exactly 2 old image references, found {s.count(old)}')
          s=s.replace(old,new)
          if s.count(new) != 2:
              raise SystemExit('New image reference was not written exactly twice')
          p.write_text(s)
          PY
          rm -f "$PARTDIR"/exact-* "$PARTDIR"/part-* "$PARTDIR"/READY
          rm -f .github/workflows/finish-social0211-image.yml

      - name: Commit finished social0211 update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use final Hillsboro mum image for social0211'
          git push origin HEAD:main
